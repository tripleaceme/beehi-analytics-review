  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1e; --bg2: #0f172a; --surface: #1e293b; --surface2: #263348;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --gold: #d4a053; --gold-bright: #e8b866; --gold-dim: rgba(212,160,83,.10);
      --green: #10b981; --blue: #3b82f6; --amber: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
      --font-head: 'Fira Code', monospace; --font-body: 'Fira Sans', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

    .layout { display: flex; min-height: 100vh; }

    .sidebar { width: 240px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); padding: 0 0 20px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .sidebar-brand { padding: 0 20px; min-height: 72px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .sidebar-brand-name { font-family: var(--font-head); font-size: 17px; font-weight: 700; color: var(--gold); }
    .sidebar-brand-tagline { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: .5px; text-transform: uppercase; }
    .sidebar-section { padding: 16px 20px 6px; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; color: var(--muted); cursor: pointer; border-left: 2px solid transparent; transition: all .15s; user-select: none; }
    .sidebar-item:hover { background: var(--surface2); color: var(--text); }
    .sidebar-item.active { background: var(--gold-dim); color: var(--gold); border-left-color: var(--gold); }
    .sidebar-item svg { flex-shrink: 0; opacity: .8; }
    .sidebar-spacer { flex: 1; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-x: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; min-height: 72px; border-bottom: 1px solid var(--border); background: rgba(15,23,42,.7); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { font-size: 11px; color: var(--green); background: rgba(16,185,129,.1); padding: 4px 10px; border-radius: 12px; font-weight: 500; }
    .date-filter { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: var(--font-body); cursor: pointer; }

    .content { padding: 24px 28px; }
    .dashboard { display: none; }
    .dashboard.active { display: block; }

    .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }
    .kpi-value { font-family: var(--font-head); font-size: 26px; font-weight: 700; margin: 6px 0 2px; color: var(--text); }
    .kpi-value.gold { color: var(--gold); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.amber { color: var(--amber); }
    .kpi-value.red { color: var(--red); }
    .kpi-delta { font-size: 11px; color: var(--muted); }

    .section-heading { font-family: var(--font-head); font-size: 13px; font-weight: 600; color: var(--gold); margin: 20px 0 10px; letter-spacing: .04em; }
    .chart-row { display: grid; gap: 14px; margin-bottom: 16px; }
    .chart-row.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .chart-row.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; overflow: hidden; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .chart-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .chart-wrap { position: relative; height: 220px; max-width: 100%; overflow: hidden; }
    .chart-source { font-size: 10px; color: var(--muted); margin-top: 8px; font-family: var(--font-head); }
    .chart-source code { background: var(--surface2); padding: 1px 4px; border-radius: 3px; font-size: 10px; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table th { text-align: left; padding: 10px 12px; background: var(--surface2); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
    .data-table tr:hover td { background: rgba(212,160,83,.04); }

    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .status-badge.delivered { background: rgba(16,185,129,.15); color: var(--green); }
    .status-badge.ready { background: rgba(59,130,246,.15); color: var(--blue); }
    .status-badge.washing { background: rgba(139,92,246,.15); color: var(--purple); }
    .status-badge.received { background: rgba(245,158,11,.15); color: var(--amber); }
    .status-badge.delayed { background: rgba(239,68,68,.15); color: var(--red); }
    .status-badge.pickup { background: rgba(212,160,83,.15); color: var(--gold); }
    .status-badge.dropoff { background: rgba(59,130,246,.15); color: var(--blue); }
    .status-badge.express { background: rgba(239,68,68,.15); color: var(--red); }

        /* ── Mobile-only elements (hidden on desktop) ── */
    .mobile-topbar { display: none; }
    .mobile-bottom-nav { display: none; }
    .mobile-drawer-backdrop { display: none; }
    .mobile-drawer { display: none; }
    .mobile-filter-bar { display: none; }

    @media (max-width: 1024px) {
      .kpi-row { grid-template-columns: repeat(3, 1fr); }
      .chart-row.cols-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      /* Hide desktop elements */
      .sidebar { display: none; }
      .topbar { display: none; }

      /* ── Mobile topbar (hamburger + title + badge + logout) ── */
      .mobile-topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 30;
      }
      .mobile-topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .mobile-hamburger {
        background: none; border: none; color: var(--text);
        padding: 4px; cursor: pointer; display: flex; flex-shrink: 0;
      }
      .mobile-topbar-title {
        font-family: var(--font-head); font-size: 14px; font-weight: 600;
        color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .mobile-topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .mobile-badge {
        background: var(--gold-dim); color: var(--gold);
        border: 1px solid rgba(212,160,83,.3);
        border-radius: 12px; padding: 2px 8px;
        font-size: 9px; font-weight: 600;
        white-space: nowrap;
      }
      .mobile-logout-btn {
        background: var(--surface2); border: 1px solid var(--border);
        color: var(--muted); border-radius: 6px;
        padding: 6px 10px; font-size: 10px; text-decoration: none;
        display: flex; align-items: center; gap: 4px;
      }

      /* ── Mobile filter bar (below topbar) ── */
      .mobile-filter-bar {
        display: flex; gap: 8px;
        padding: 10px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 57px; z-index: 25;
      }
      .mobile-filter-bar select {
        flex: 1; background: var(--surface2); border: 1px solid var(--border);
        color: var(--text); border-radius: 6px; padding: 6px 10px;
        font-family: var(--font-body); font-size: 12px;
      }

      /* ── Mobile bottom tab bar ── */
      .mobile-bottom-nav {
        display: flex;
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 8px 4px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 30;
        box-shadow: 0 -4px 20px rgba(0,0,0,.3);
      }
      .mobile-nav-item {
        flex: 1; min-width: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 4px; padding: 6px 2px;
        background: none; border: none;
        color: var(--muted); cursor: pointer;
        font-family: var(--font-body); font-size: 9px;
        transition: color .15s;
        overflow: hidden; white-space: nowrap;
      }
      .mobile-nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
      .mobile-nav-item.active { color: var(--gold); }

      /* ── Mobile drawer (slide-out side panel) ── */
      .mobile-drawer-backdrop {
        display: block;
        position: fixed; inset: 0;
        background: rgba(0,0,0,.6);
        opacity: 0; pointer-events: none;
        transition: opacity .3s;
        z-index: 40;
      }
      .mobile-drawer-backdrop.open { opacity: 1; pointer-events: auto; }
      .mobile-drawer {
        display: flex; flex-direction: column;
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 80%; max-width: 300px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        z-index: 50;
        transform: translateX(-100%);
        transition: transform .3s ease;
        overflow-y: auto;
      }
      .mobile-drawer.open { transform: translateX(0); }
      .mobile-drawer-header {
        padding: 20px; border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; align-items: center;
      }
      .mobile-drawer-brand {
        font-family: var(--font-head); font-size: 15px; font-weight: 700;
        color: var(--gold);
      }
      .mobile-drawer-brand span { display: block; font-size: 10px; color: var(--muted); font-weight: 400; margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
      .mobile-drawer-close {
        background: none; border: none; color: var(--muted); cursor: pointer;
      }
      .mobile-drawer-section {
        padding: 12px 20px 6px;
        font-size: 10px; font-weight: 600;
        color: var(--muted);
        text-transform: uppercase; letter-spacing: .08em;
      }
      .mobile-drawer-item {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 20px;
        color: var(--muted); text-decoration: none;
        font-size: 14px; font-weight: 500;
        border: none; background: none; width: 100%; text-align: left;
        font-family: var(--font-body); cursor: pointer;
      }
      .mobile-drawer-item:hover { background: var(--surface2); color: var(--text); }
      .mobile-drawer-item svg { flex-shrink: 0; }

      /* ── Content adjustments ── */
      .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .kpi-card { padding: 14px; }
      .kpi-value { font-size: 20px; }
      .kpi-label { font-size: 10px; }
      .kpi-delta { font-size: 10px; }
      .chart-row.cols-2, .chart-row.cols-3 { grid-template-columns: 1fr; }
      .content { padding: 16px 12px 100px 12px; }
      .section-heading { font-size: 10px; }
      .chart-card { padding: 14px; }
      .chart-title { font-size: 12px; }
      .data-table { font-size: 11px; }
      .data-table th, .data-table td { padding: 8px; }
    }
  </style>

const GRID = 'rgba(51,65,85,.5)', TICK = '#94a3b8', GOLD = '#d4a053', GREEN = '#10b981', BLUE = '#3b82f6', AMBER = '#f59e0b', RED = '#ef4444', PURPLE = '#8b5cf6';
Chart.defaults.color = TICK;
Chart.defaults.font.family = "'Fira Sans', sans-serif";
Chart.defaults.font.size = 11;
const N = v => '\u20A6' + Number(v).toLocaleString();
const shortN = v => '\u20A6' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'k' : v);
function baseOpts(extra = {}) {
  return { responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{labels:{boxWidth:10,padding:12,font:{size:11}}}, tooltip:{backgroundColor:'#0f172a',borderColor:'#334155',borderWidth:1,padding:10} },
    scales:{ x:{grid:{color:GRID},ticks:{color:TICK}}, y:{grid:{color:GRID},ticks:{color:TICK}} }, ...extra };
}
function noLegend(o){ o.plugins.legend.display=false; return o; }
function donutOpts(){ return {responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,padding:10,font:{size:11}}},tooltip:{backgroundColor:'#0f172a',borderColor:'#334155',borderWidth:1}}}; }
function nairaAxis(){ return { y:{grid:{color:GRID},ticks:{color:TICK,callback:v=>shortN(v)}} }; }
const charts = {};
function makeChart(id, cfg){ if(charts[id]){ charts[id].destroy(); } const el=document.getElementById(id); if(!el) return; charts[id]=new Chart(el, cfg); }
function statusBadge(s){ return `<span class="status-badge ${s}">${s}</span>`; }

function getYearFilter(){ return parseInt(document.getElementById('year-filter').value); }
function getMonthFilter(){ const v = document.getElementById('month-filter').value; return v === 'all' ? null : parseInt(v); }
// Demo data is Jan–Apr 2026 only. Selecting a year without data yields an empty filtered set.
function filteredMonthly(){
  if (getYearFilter() !== 2026) return [];
  const m = getMonthFilter();
  return m ? DATA.monthly.filter(r => r.month === m) : DATA.monthly;
}

function renderAll(){
  renderOverview();
  renderOrders();
  renderServices();
  renderFinancials();
  renderCustomers();
}

function renderOverview(){
  const k = DATA.kpis;
  const m = filteredMonthly();
  const revFiltered = m.reduce((s,r) => s + r.revenue, 0);
  const ordersFiltered = m.reduce((s,r) => s + r.orders, 0);
  const onTimeFiltered = m.reduce((s,r) => s + r.onTime, 0);
  const onTimePct = ordersFiltered ? Math.round(onTimeFiltered/ordersFiltered*100) : 0;
  const avgTa = m.length ? Math.round(m.reduce((s,r) => s + r.avgTurnaround, 0) / m.length) : 0;

  document.getElementById('dashboard-overview').innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Orders</div><div class="kpi-value gold">${ordersFiltered}</div><div class="kpi-delta">Filtered period</div></div>
      <div class="kpi-card"><div class="kpi-label">Revenue</div><div class="kpi-value green">${N(revFiltered)}</div><div class="kpi-delta">Filtered period</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg Turnaround</div><div class="kpi-value">${avgTa}h</div><div class="kpi-delta">Target &lt; 48h</div></div>
      <div class="kpi-card"><div class="kpi-label">On-time Rate</div><div class="kpi-value ${onTimePct>=90?'green':'amber'}">${onTimePct}%</div><div class="kpi-delta">Delivered on promise</div></div>
      <div class="kpi-card"><div class="kpi-label">Repeat Customers</div><div class="kpi-value gold">${k.repeatCustomerRate}%</div><div class="kpi-delta">2+ orders</div></div>
    </div>

    <div class="section-heading">Volume &amp; Revenue</div>
    <div class="chart-row cols-2">
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Monthly Revenue</span></div><div class="chart-wrap"><canvas id="c-rev"></canvas></div><div class="chart-source">Source: <code>orders.total_amount</code></div></div>
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Orders per Month</span></div><div class="chart-wrap"><canvas id="c-ord"></canvas></div><div class="chart-source">Source: <code>orders.received_at</code></div></div>
    </div>

    <div class="section-heading">Operations</div>
    <div class="chart-row cols-3">
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Orders by Day of Week</span></div><div class="chart-wrap"><canvas id="c-dow"></canvas></div><div class="chart-source">Source: <code>orders.received_at::dow</code></div></div>
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Service Mix</span></div><div class="chart-wrap"><canvas id="c-mix"></canvas></div><div class="chart-source">Source: <code>orders.service_id</code></div></div>
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Pickup vs Drop-off</span></div><div class="chart-wrap"><canvas id="c-ch"></canvas></div><div class="chart-source">Source: <code>orders.channel</code></div></div>
    </div>`;

  const mm = DATA.monthly;
  makeChart('c-rev', {type:'line', data:{labels: mm.map(r=>r.label), datasets:[{label:'Revenue', data: mm.map(r=>r.revenue), borderColor: GOLD, backgroundColor:'rgba(212,160,83,.1)', tension:.35, fill:true, pointRadius:3}]}, options: noLegend(baseOpts({scales:{x:{grid:{color:GRID},ticks:{color:TICK}}, ...nairaAxis()}}))});
  makeChart('c-ord', {type:'bar', data:{labels: mm.map(r=>r.label), datasets:[{label:'Orders', data: mm.map(r=>r.orders), backgroundColor: BLUE}]}, options: noLegend(baseOpts())});
  makeChart('c-dow', {type:'bar', data:{labels: DATA.dayOfWeek.map(d=>d.day), datasets:[{label:'Orders', data: DATA.dayOfWeek.map(d=>d.count), backgroundColor: GOLD}]}, options: noLegend(baseOpts())});
  const svc = DATA.services;
  makeChart('c-mix', {type:'doughnut', data:{labels: svc.map(s=>s.name), datasets:[{data: svc.map(s=>s.orders), backgroundColor: svc.map(s=>s.color), borderWidth:0}]}, options: donutOpts()});
  const cs = DATA.channelSplit;
  makeChart('c-ch', {type:'doughnut', data:{labels:['Pickup/Delivery','Drop-off'], datasets:[{data:[cs.pickup, cs.dropoff], backgroundColor:[GOLD, BLUE], borderWidth:0}]}, options: donutOpts()});
}

function renderOrders(){
  const m = filteredMonthly();
  const orders = m.reduce((s,r) => s + r.orders, 0);
  const onTime = m.reduce((s,r) => s + r.onTime, 0);
  const late = orders - onTime;

  document.getElementById('dashboard-orders').innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Total Orders</div><div class="kpi-value gold">${orders}</div><div class="kpi-delta">Filtered period</div></div>
      <div class="kpi-card"><div class="kpi-label">On-time</div><div class="kpi-value green">${onTime}</div><div class="kpi-delta">Delivered on promise</div></div>
      <div class="kpi-card"><div class="kpi-label">Late</div><div class="kpi-value red">${late}</div><div class="kpi-delta">Past promise time</div></div>
      <div class="kpi-card"><div class="kpi-label">Express 24h</div><div class="kpi-value" style="color:var(--red)">${DATA.services.find(s=>s.name==='Express 24hr').orders}</div><div class="kpi-delta">Premium surcharge</div></div>
      <div class="kpi-card"><div class="kpi-label">In Process</div><div class="kpi-value" style="color:var(--purple)">24</div><div class="kpi-delta">Open right now</div></div>
    </div>

    <div class="section-heading">Turnaround &amp; Delivery</div>
    <div class="chart-row cols-2">
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Turnaround Distribution</span></div><div class="chart-wrap"><canvas id="c-tb"></canvas></div><div class="chart-source">Source: <code>orders.turnaround_hrs</code></div></div>
      <div class="chart-card"><div class="chart-header"><span class="chart-title">On-time Rate Trend</span></div><div class="chart-wrap"><canvas id="c-otr"></canvas></div><div class="chart-source">Source: <code>orders.promised_at, delivered_at</code></div></div>
    </div>

    <div class="section-heading">Recent Orders</div>
    <div class="chart-card" style="overflow-x:auto">
      <table class="data-table">
        <thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Items</th><th>Total</th><th>Turnaround</th><th>Status</th></tr></thead>
        <tbody>${DATA.recentOrders.map(o => `
          <tr><td style="color:var(--gold);font-family:var(--font-head)">${o.id}</td><td>${o.customer}</td><td>${o.service}</td><td>${o.items}</td><td style="color:var(--green)">${N(o.total)}</td><td style="color:${o.turnaround<=48?'var(--green)':o.turnaround<=72?'var(--amber)':'var(--red)'}">${o.turnaround}h</td><td>${statusBadge(o.status)}</td></tr>
        `).join('')}</tbody>
      </table>
    </div>`;

  const tb = DATA.turnaroundBuckets;
  makeChart('c-tb', {type:'bar', data:{labels: tb.map(b=>b.label), datasets:[{label:'Orders', data: tb.map(b=>b.count), backgroundColor:[GREEN, BLUE, AMBER, RED]}]}, options: noLegend(baseOpts())});
  const mm = DATA.monthly;
  const otr = mm.map(r => Math.round(r.onTime/r.orders*100));
  makeChart('c-otr', {type:'line', data:{labels: mm.map(r=>r.label), datasets:[{label:'On-time %', data: otr, borderColor: GREEN, backgroundColor:'rgba(16,185,129,.1)', tension:.3, fill:true, pointRadius:3}]}, options: noLegend(baseOpts({scales:{x:{grid:{color:GRID},ticks:{color:TICK}}, y:{grid:{color:GRID},ticks:{color:TICK,callback:v=>v+'%'}, min:70, max:100}}}))});
}

function renderServices(){
  const svc = DATA.services;
  const totalOrders = svc.reduce((s,v) => s + v.orders, 0);
  const est = svc.filter(s => s.price > 0).map(s => ({ name: s.name, rev: s.orders * s.price }));
  const totalRev = est.reduce((s,v) => s + v.rev, 0);
  const top = [...est].sort((a,b) => b.rev - a.rev)[0];

  document.getElementById('dashboard-services').innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Services</div><div class="kpi-value gold">${svc.length}</div><div class="kpi-delta">Menu items</div></div>

      <div class="kpi-card"><div class="kpi-label">Top Earner</div><div class="kpi-value gold" style="font-size:15px">${top.name}</div><div class="kpi-delta">${N(top.rev)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Express Share</div><div class="kpi-value" style="color:var(--red)">${Math.round(svc.find(s=>s.name==='Express 24hr').orders/totalOrders*100)}%</div><div class="kpi-delta">Of total orders</div></div>
    </div>

    <div class="section-heading">Service Performance</div>
    <div class="chart-row cols-2">
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Orders by Service</span></div><div class="chart-wrap"><canvas id="c-svc-o"></canvas></div><div class="chart-source">Source: <code>orders.service_id</code></div></div>
      <div class="chart-card"><div class="chart-header"><span class="chart-title">Revenue by Service</span></div><div class="chart-wrap"><canvas id="c-svc-r"></canvas></div><div class="chart-source">Source: <code>services.price, orders</code></div></div>
    </div>

    <div class="section-heading">Service Menu</div>
    <div class="chart-card" style="overflow-x:auto">
      <table class="data-table">
        <thead><tr><th>Service</th><th>Price</th><th>Unit</th><th>Orders</th><th>Est. Revenue</th></tr></thead>
        <tbody>${svc.map(s => `<tr><td><strong>${s.name}</strong></td><td>${s.price>0?N(s.price):'+50%'}</td><td>${s.unit}</td><td>${s.orders}</td><td style="color:var(--gold)">${s.price>0?N(s.price*s.orders):'&mdash;'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;

  const sortedO = [...svc].sort((a,b) => b.orders - a.orders);
  makeChart('c-svc-o', {type:'bar', data:{labels: sortedO.map(s=>s.name), datasets:[{label:'Orders', data: sortedO.map(s=>s.orders), backgroundColor: GOLD}]}, options: noLegend({...baseOpts(), indexAxis:'y'})});
  const sortedR = [...est].sort((a,b) => b.rev - a.rev);
  makeChart('c-svc-r', {type:'bar', data:{labels: sortedR.map(s=>s.name), datasets:[{label:'Revenue', data: sortedR.map(s=>s.rev), backgroundColor: GREEN}]}, options: noLegend(baseOpts({scales:{x:{grid:{color:GRID},ticks:{color:TICK}}, ...nairaAxis()}}))});
}

      <div class="chart-card"><div class="chart-header"><span class="chart-title">Revenue by Month</span></div><div class="chart-wrap"><canvas id="c-fin-rev"></canvas></div><div class="chart-source">Source: <code>orders.total_amount</code></div></div>

  const mm = DATA.monthly;
  makeChart('c-fin-rev', {type:'bar', data:{labels: mm.map(r=>r.label), datasets:[{label:'Revenue', data: mm.map(r=>r.revenue), backgroundColor: GOLD}]}, options: noLegend(baseOpts({scales:{x:{grid:{color:GRID},ticks:{color:TICK}}, ...nairaAxis()}}))});

}

    <div class="chart-card" style="overflow-x:auto">
      <table class="data-table">
        <thead><tr><th>Customer</th><th>Orders</th><th>Revenue</th><th>Avg per Order</th></tr></thead>
        <tbody>${tc.map(c => `
          <tr><td><strong>${c.name}</strong></td><td>${c.orders}</td><td style="color:var(--green)">${N(c.revenue)}</td><td>${N(Math.round(c.revenue/c.orders))}</td></tr>
        `).join('')}</tbody>
      </table>
    </div>`;

  makeChart('c-cust-o', {type:'bar', data:{labels: tc.map(c=>c.name.split(' ')[0]), datasets:[{label:'Orders', data: tc.map(c=>c.orders), backgroundColor: GOLD}]}, options: noLegend(baseOpts())});
  makeChart('c-cust-r', {type:'bar', data:{labels: tc.map(c=>c.name.split(' ')[0]), datasets:[{label:'Revenue', data: tc.map(c=>c.revenue), backgroundColor: GREEN}]}, options: noLegend(baseOpts({scales:{x:{grid:{color:GRID},ticks:{color:TICK}}, ...nairaAxis()}}))});
}

function switchTab(name){
  document.querySelectorAll('.dashboard').forEach(d => d.classList.remove('active'));
  document.getElementById('dashboard-' + name).classList.add('active');
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  const sidebarMap = { overview:0, orders:1, services:2, financials:3, customers:4 };
  const sidebarItems = document.querySelectorAll('.sidebar-item');
  if (sidebarMap[name] !== undefined) sidebarItems[sidebarMap[name]].classList.add('active');
  const titles = { overview:'Overview', orders:'Orders', services:'Services', financials:'Financials', customers:'Customers' };
  document.getElementById('topbar-title').textContent = titles[name];
  const mobileTitle = document.getElementById('mobile-topbar-title');
  if (mobileTitle) mobileTitle.textContent = titles[name];
  document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
  const nav = document.querySelector('.mobile-nav-item[data-tab="'+name+'"]');
  if (nav) nav.classList.add('active');
  // Close drawer on tab change
  const drawer = document.getElementById('mobile-drawer');
  if (drawer && drawer.classList.contains('open')) toggleDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Mobile drawer toggle ── */
function toggleDrawer() {
  document.getElementById('mobile-drawer').classList.toggle('open');
  document.getElementById('mobile-drawer-backdrop').classList.toggle('open');
}

// Mobile filter bar mirrors desktop filters. Changes in either propagate to the other.
function syncFiltersFromMobile(){
  document.getElementById('year-filter').value  = document.getElementById('mobile-year-filter').value;
  document.getElementById('month-filter').value = document.getElementById('mobile-month-filter').value;
  renderAll();
}
function syncFiltersFromDesktop(){
  const my = document.getElementById('mobile-year-filter');
  const mm = document.getElementById('mobile-month-filter');
  if (my) my.value = document.getElementById('year-filter').value;
  if (mm) mm.value = document.getElementById('month-filter').value;
  renderAll();
}
document.getElementById('year-filter').addEventListener('change', syncFiltersFromDesktop);
document.getElementById('month-filter').addEventListener('change', syncFiltersFromDesktop);
document.getElementById('mobile-year-filter').addEventListener('change', syncFiltersFromMobile);
document.getElementById('mobile-month-filter').addEventListener('change', syncFiltersFromMobile);
renderAll();
</script>
